services:
  app:
    build: .
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - server/.env
    volumes:
      - server-data:/app/server/data
    # 统计分析（可选，默认关闭）
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx

volumes:
  server-data:
